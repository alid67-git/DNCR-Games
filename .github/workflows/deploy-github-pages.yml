name: Deploy GitHub Pages

on:
  push:
    branches: [main, cursor/dots-and-boxes-game-0b7f]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static site (Kati + Noktalar)
        run: |
          mkdir -p _site/noktalar
          # Kati Arena → site kökü
          if [ -d public ]; then cp -a public/. _site/; fi
          # Noktalar ve Kutular → /noktalar/
          if [ -d dots-and-boxes/public ]; then
            cp -a dots-and-boxes/public/. _site/noktalar/
          fi
          # Kökte ikinci oyuna link kartı (opsiyonel index ekleme yok — Kati kalsın)
          printf '%s\n' \
            'User-agent: *' \
            'Allow: /' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
