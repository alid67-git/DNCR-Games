name: Tag Hub Release

# main’e hub sürüm bump’ı gelince hub-vX.Y.Z yoksa tag basar → Release Hub APK tetiklenir.
on:
  push:
    branches: [main]
    paths:
      - "site/hub/app-config.js"
      - "hub/package.json"
      - "hub/android/app/build.gradle"

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-hub-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create hub-v tag if missing + dispatch APK release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(grep -oP 'version:\s*"\K[^"]+' site/hub/app-config.js | head -1)
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Geçersiz hub sürümü: $V"
            exit 1
          fi
          TAG="hub-v${V}"
          CREATED=0
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || \
             git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Tag zaten var: $TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "DNCR Games Hub v${V}"
            git push origin "$TAG"
            CREATED=1
            echo "Pushed $TAG"
          fi
          # GITHUB_TOKEN ile basılan tag diğer workflow’ları tetiklemez —
          # Release Hub APK’yı açıkça workflow_dispatch ile çalıştır.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG zaten var — dispatch atlandı"
          else
            gh workflow run "Release Hub APK" --ref main -f "tag=${TAG}"
            echo "Dispatched Release Hub APK for $TAG (created=${CREATED})"
          fi
