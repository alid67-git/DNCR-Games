name: Release Hub APK

# hub-v1.0.17 gibi tag → imzalı hub APK + GitHub Release
on:
  push:
    tags:
      - "hub-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "hub-vX.Y.Z (boşsa site/hub/app-config.js sürümü)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-hub-apk
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_NAME}" == hub-v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            V=$(grep -oP 'version:\s*"\K[^"]+' site/hub/app-config.js | head -1)
            TAG="hub-v${V}"
          fi
          VERSION="${TAG#hub-v}"
          VERSION="${VERSION#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=DNCR-Games-hub-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          echo "Building $TAG ($VERSION)"

      - name: Install hub deps + sync www (latest games)
        working-directory: hub
        run: |
          npm ci || npm install
          npm run android:sync

      - name: Assemble signed debug APK (hub keystore)
        working-directory: hub/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          SRC=hub/android/app/build/outputs/apk/debug/app-debug.apk
          DEST="${{ steps.ver.outputs.apk }}"
          cp "$SRC" "$DEST"
          ls -la "$DEST"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "DNCR Games Hub v${{ steps.ver.outputs.version }}"
          body: |
            ## Hub ${{ steps.ver.outputs.version }}

            Güncel oyun paketleri (Tavla tempo / tahta / undo-redo / Android yükseklik düzeltmeleri dahil).

            **APK:** `${{ steps.ver.outputs.apk }}`
            **Web:** https://alid67-git.github.io/DNCR-Games/

            Önceki hub sürümünün üzerine kurulabilir (aynı imza).
            Hub içinde **Güncellemeyi kontrol et** veya açılışta çıkan güncelleme penceresi.
          files: ${{ steps.ver.outputs.apk }}
          make_latest: true
          fail_on_unmatched_files: true
