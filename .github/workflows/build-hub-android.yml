name: Build Hub Android

# RideAtlas (Uğur) tarzı: main’de hub/oyun değişince APK derle,
# tek rolling etiket android-latest üzerine yaz.
on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "site/hub/**"
      - "sayibulma/public/**"
      - "scripts/build-pages.mjs"
      - "scripts/sync-shared.mjs"
      - ".github/workflows/build-hub-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-android-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract hub version
        id: version
        run: |
          VERSION=$(node -e "const c=require('./site/hub/app-config.js');" 2>/dev/null || true)
          VERSION=$(grep -oP 'version:\s*"\K[^"]+' site/hub/app-config.js | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Hub version: $VERSION"

      - name: Install hub deps + sync www
        working-directory: hub
        run: |
          npm ci || npm install
          npm run android:sync

      - name: Assemble debug APK
        working-directory: hub/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK (stable asset name)
        run: |
          SRC=hub/android/app/build/outputs/apk/debug/app-debug.apk
          DEST=hub/android/app/build/outputs/apk/debug/DNCR-Games-hub.apk
          cp "$SRC" "$DEST"
          ls -la "$DEST"

      - name: Publish android-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "DNCR Games Hub (latest) - v${{ steps.version.outputs.version }}"
          body: |
            RideAtlas tarzı rolling release — her build’de üzerine yazılır.
            Telefonda hub **Güncellemeyi kontrol et** veya alt banttaki **Güncelle**.

            Sabit indirme: DNCR-Games-hub.apk
          files: hub/android/app/build/outputs/apk/debug/DNCR-Games-hub.apk
          make_latest: false
          fail_on_unmatched_files: true
