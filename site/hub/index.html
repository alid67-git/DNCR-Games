<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DNCR Games</title>
  <meta name="theme-color" content="#1a1208" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DNCR Games" />
  <meta name="description" content="DNCR Games — Kati, Noktalar ve Kutular, Dokuztaş, Kuşatma, Sayı Bulma." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f7ecd4;
      --muted: rgba(247, 236, 212, 0.62);
      --accent: #f0c75a;
      --line: rgba(240, 199, 90, 0.28);
      --card: rgba(28, 18, 10, 0.72);
      --font: "Manrope", system-ui, sans-serif;
      --display: "Sora", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 45% at 50% -8%, #6b3d1c 0%, transparent 55%),
        radial-gradient(circle at 85% 75%, rgba(30, 120, 110, 0.22), transparent 42%),
        radial-gradient(circle at 12% 70%, rgba(180, 60, 40, 0.18), transparent 40%),
        linear-gradient(165deg, #2a1a0e, #120c07 58%, #070504);
      padding: max(1.4rem, env(safe-area-inset-top)) 1.15rem max(2rem, env(safe-area-inset-bottom));
    }
    main {
      width: min(440px, 100%);
      margin: 0 auto;
      text-align: center;
    }
    .brand {
      margin: 0.4rem 0 1.35rem;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .brand img {
      width: min(112px, 30vw);
      height: auto;
      border-radius: 28%;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(240, 199, 90, 0.22);
    }
    h1 {
      margin: 0.95rem 0 0.3rem;
      font-family: var(--display);
      font-size: clamp(2rem, 9vw, 2.55rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--accent);
      text-shadow: 0 2px 18px rgba(240, 199, 90, 0.25);
    }
    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .games {
      display: flex;
      flex-direction: column;
      gap: 0.72rem;
      margin-top: 0.35rem;
    }
    .game {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 0.85rem;
      align-items: center;
      text-align: left;
      text-decoration: none;
      color: inherit;
      padding: 0.65rem 0.9rem 0.65rem 0.65rem;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--card);
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
      animation: rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
      overflow: hidden;
    }
    .game:nth-child(1) { animation-delay: 0.06s; }
    .game:nth-child(2) { animation-delay: 0.12s; }
    .game:nth-child(3) { animation-delay: 0.18s; }
    .game:nth-child(4) { animation-delay: 0.24s; }
    .game:nth-child(5) { animation-delay: 0.30s; }
    .game:active { transform: scale(0.98); }
    .game:hover {
      border-color: rgba(240, 199, 90, 0.48);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }
    .game-art {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      display: block;
      background: #1a120c;
      box-shadow: inset 0 0 0 1px rgba(240, 199, 90, 0.18);
    }
    .game-copy { min-width: 0; }
    .game strong {
      display: block;
      font-family: var(--display);
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .game span {
      display: block;
      margin-top: 0.18rem;
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.3;
    }
    footer {
      margin-top: 1.6rem;
      font-size: 0.78rem;
      color: rgba(247, 236, 212, 0.38);
      animation: rise 0.8s ease both;
      animation-delay: 0.22s;
    }
    .hub-actions {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
    }
    .btn-update-check {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(28, 18, 10, 0.55);
      color: var(--muted);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.55rem 0.95rem;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn-update-check:active { transform: scale(0.98); }
    .hub-toast {
      position: fixed;
      left: 50%;
      bottom: max(1.25rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 60;
      max-width: min(360px, calc(100% - 2rem));
      padding: 0.7rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(20, 12, 6, 0.92);
      color: var(--ink);
      font-size: 0.88rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .hub-modal {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: rgba(8, 5, 2, 0.72);
      backdrop-filter: blur(3px);
    }
    .hub-modal[hidden] { display: none !important; }
    .hub-modal-card {
      width: min(400px, 100%);
      padding: 1.35rem 1.25rem 1.2rem;
      border-radius: 16px;
      border: 1px solid rgba(240, 199, 90, 0.32);
      background: linear-gradient(165deg, #2a1a0e, #140e08);
      text-align: left;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .hub-modal-card h2 {
      margin: 0 0 0.55rem;
      font-family: var(--display);
      font-size: 1.25rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .hub-modal-card p {
      margin: 0 0 1.1rem;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.45;
    }
    .hub-modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .hub-modal-actions button {
      appearance: none;
      border: 1px solid var(--line);
      font: inherit;
      font-weight: 700;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      cursor: pointer;
    }
    .hub-btn-primary {
      background: linear-gradient(135deg, #e8c878, #f0c75a);
      border-color: transparent;
      color: #1a1208;
    }
    .hub-btn-ghost {
      background: rgba(28, 18, 10, 0.65);
      color: var(--ink);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <img src="assets/icon-512.png" width="112" height="112" alt="DNCR Games" />
      <h1>DNCR Games</h1>
      <p class="lede">Oyununu seç</p>
    </header>

    <nav class="games" aria-label="Oyunlar">
      <a class="game" href="kati/index.html" data-game="kati">
        <img class="game-art" src="assets/kati-icon.png" width="64" height="64" alt="" />
        <span class="game-copy">
          <strong>Kati</strong>
          <span>Kırmızı vs yeşil</span>
        </span>
      </a>
      <a class="game" href="noktalar/index.html" data-game="noktalar">
        <img class="game-art" src="assets/noktalar-icon.png" width="64" height="64" alt="" />
        <span class="game-copy">
          <strong>Noktalar ve Kutular</strong>
          <span>Çizgi çek, kutuyu kapat</span>
        </span>
      </a>
      <a class="game" href="dokuztas/index.html" data-game="dokuztas">
        <img class="game-art" src="assets/dokuztas-icon.png" width="64" height="64" alt="" />
        <span class="game-copy">
          <strong>Dokuztaş</strong>
          <span>Değirmen kur</span>
        </span>
      </a>
      <a class="game" href="kusatma/index.html" data-game="kusatma">
        <img class="game-art" src="assets/kusatma-icon.png" width="64" height="64" alt="" />
        <span class="game-copy">
          <strong>Kuşatma</strong>
          <span>Çizgi çek, kuşat, esir al</span>
        </span>
      </a>
      <a class="game" href="sayi/index.html" data-game="sayi">
        <img class="game-art" src="assets/sayi-icon.svg" width="64" height="64" alt="" />
        <span class="game-copy">
          <strong>Sayı Bulma</strong>
          <span>4 hane · artı / eksi</span>
        </span>
      </a>
    </nav>

    <div class="hub-actions">
      <button type="button" class="btn-update-check" id="btn-hub-check-update">Güncellemeyi kontrol et</button>
    </div>

    <footer>Tek uygulama · iPhone / iPad / Android · Yardım her oyunun içinde<br /><span id="hub-ver">v1.0.5</span></footer>
  </main>

  <div id="hub-toast" class="hub-toast" hidden role="status"></div>

  <div id="hub-update-modal" class="hub-modal" hidden role="dialog" aria-modal="true" aria-labelledby="hub-update-title">
    <div class="hub-modal-card">
      <h2 id="hub-update-title">Yeni sürüm hazır</h2>
      <p id="hub-update-body"></p>
      <div class="hub-modal-actions">
        <button type="button" class="hub-btn-primary" id="btn-hub-update-now">Şimdi güncelle</button>
        <button type="button" class="hub-btn-ghost" id="btn-hub-update-later">Daha sonra</button>
      </div>
    </div>
  </div>

  <script src="app-config.js"></script>
  <script src="hub-update.js"></script>
  <script>
    (function () {
      // Capacitor: klasör URL’leri (kati/) html5mode ile hub’a düşer — her zaman …/index.html
      document.querySelectorAll("a.game[data-game]").forEach(function (a) {
        a.addEventListener("click", function (e) {
          var id = a.getAttribute("data-game");
          if (!id) return;
          e.preventDefault();
          var target = new URL(id + "/index.html", window.location.href).href;
          window.location.assign(target);
        });
      });
    })();
  </script>
</body>
</html>
