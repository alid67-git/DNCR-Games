<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Kuşatma</title>
  <meta name="theme-color" content="#1E1E24" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kuşatma" />
  <meta name="description" content="Kuşatma (The Siege) — çizgi çek, taş taşı, esir al. DNCR Games." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="shared/shell-ui.css" />
</head>
<body>
  <div class="bg-fx" aria-hidden="true"></div>
  <main id="app">
    <section id="screen-home" class="screen active">
      <div class="home-center">
        <header class="brand home-brand">
          <img class="app-logo" src="assets/logo.svg" width="112" height="112" alt="Kuşatma" />
          <p class="brand-mark" data-i18n="appName">Kuşatma</p>
          <p class="lede" data-i18n="tagline">Çizgi çek, kuşat, esir al</p>
        </header>
        <nav class="home-menu" aria-label="Main">
          <button type="button" class="btn btn-primary btn-menu" id="btn-home-play">
            <span class="menu-label" data-i18n="homePlay">Oyna</span>
          </button>
          <button type="button" class="btn btn-ghost btn-menu" id="btn-home-scores">
            <span class="menu-label" data-i18n="homeScores">Skorlar</span>
          </button>
          <button type="button" class="btn btn-ghost btn-menu" id="btn-home-settings">
            <span class="menu-label" data-i18n="homeSettings">Ayarlar</span>
          </button>
          <button type="button" class="btn btn-ghost btn-menu" id="btn-home-help">
            <span class="menu-label" data-i18n="homeHelp">Yardım</span>
          </button>
          <button type="button" class="btn btn-ghost btn-menu btn-hub-back" id="btn-hub-back" data-i18n="hubBack">DNCR Games</button>
        </nav>
        <p class="home-footer-ver" id="home-version">v1.0.0</p>
      </div>
    </section>

    <section id="screen-scores" class="screen">
      <button type="button" class="btn-back" id="btn-scores-back" data-i18n="back">Geri</button>
      <header class="brand sm-head"><h1 data-i18n="scoresTitle">Skorlar</h1></header>
      <div id="scores-panel" class="scores-panel"></div>
    </section>

    <section id="screen-play" class="screen">
      <button type="button" class="btn-back" id="btn-play-back" data-i18n="back">Geri</button>
      <header class="brand sm-head"><h1 data-i18n="playTitle">Oyun modu</h1></header>
      <div class="mode-list">
        <button type="button" class="mode-card" id="btn-mode-solo">
          <div class="mode-copy">
            <strong data-i18n="playSolo">Bilgisayara karşı</strong>
            <span data-i18n="playSoloHint">Tek kişi — internet gerekmez</span>
          </div>
        </button>
        <button type="button" class="mode-card" id="btn-mode-2p">
          <div class="mode-copy">
            <strong data-i18n="play2p">Aynı cihazda iki kişi</strong>
            <span data-i18n="play2pHint">Telefon/tablet elden ele — ağ gerekmez</span>
          </div>
        </button>
        <button type="button" class="mode-card" id="btn-mode-remote">
          <div class="mode-copy">
            <strong data-i18n="playRemote">İki telefonda / uzaktan</strong>
            <span data-i18n="playRemoteHint">Yakında — bu sürümde yerel ve AI</span>
          </div>
        </button>
      </div>
    </section>

    <section id="screen-solo-setup" class="screen">
      <button type="button" class="btn-back" id="btn-solo-back" data-i18n="back">Geri</button>
      <header class="brand sm-head"><h1 data-i18n="soloSetupTitle">Bilgisayara karşı</h1></header>
      <label class="field"><span data-i18n="youAre">Sen</span>
        <input id="solo-name" type="text" maxlength="16" data-i18n-ph="namePh" placeholder="İsim (isteğe bağlı)" />
      </label>
      <p class="section-label" data-i18n="diffTitle">Zorluk</p>
      <div id="diff-grid" class="diff-grid"></div>
      <button type="button" class="btn btn-primary btn-block" id="btn-solo-start" data-i18n="startGame">Başla</button>
    </section>

    <section id="screen-2p-setup" class="screen">
      <button type="button" class="btn-back" id="btn-2p-back" data-i18n="back">Geri</button>
      <header class="brand sm-head"><h1 data-i18n="twoPSetupTitle">İki kişilik</h1></header>
      <label class="field"><span data-i18n="player1">Oyuncu 1</span>
        <input id="p1-name" type="text" maxlength="16" data-i18n-ph="namePh" placeholder="İsim (isteğe bağlı)" />
      </label>
      <label class="field"><span data-i18n="player2">Oyuncu 2</span>
        <input id="p2-name" type="text" maxlength="16" data-i18n-ph="namePh" placeholder="İsim (isteğe bağlı)" />
      </label>
      <button type="button" class="btn btn-primary btn-block" id="btn-2p-start" data-i18n="startGame">Başla</button>
    </section>

    <section id="screen-remote" class="screen">
      <button type="button" class="btn-back" id="btn-remote-back" data-i18n="back">Geri</button>
      <header class="brand sm-head"><h1 data-i18n="playRemote">Uzaktan</h1></header>
      <p class="help-body" data-i18n="remoteSoon"></p>
    </section>

    <section id="screen-settings" class="screen">
      <button type="button" class="btn-back" id="btn-settings-back" data-i18n="back">Geri</button>
      <header class="brand sm-head"><h1 data-i18n="settingsTitle">Ayarlar</h1></header>
      <label class="field"><span data-i18n="lang">Dil</span>
        <select id="set-lang">
          <option value="tr">Türkçe</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="field"><span data-i18n="defaultDiff">Varsayılan zorluk</span>
        <select id="set-diff">
          <option value="easy">Kolay</option>
          <option value="medium">Orta</option>
          <option value="hard">Zor</option>
        </select>
      </label>
      <p class="home-footer-ver" id="settings-version">v1.0.0</p>
    </section>

    <section id="screen-help" class="screen">
      <button type="button" class="btn-back" id="btn-help-back" data-i18n="back">Geri</button>
      <header class="brand sm-head"><h1 data-i18n="helpTitle">Yardım</h1></header>
      <article class="help-block">
        <h2 data-i18n="helpRulesTitle">Kurallar</h2>
        <p class="help-body" data-i18n="helpRules"></p>
      </article>
      <article class="help-block">
        <h2 data-i18n="helpModesTitle">Oyun modları</h2>
        <p class="help-body" data-i18n="helpModes"></p>
      </article>
      <article class="help-block">
        <h2 data-i18n="helpDiffTitle">Zorluk</h2>
        <p class="help-body" data-i18n="helpDiff"></p>
      </article>
      <article class="help-block">
        <h2 data-i18n="helpRemoteTitle">Uzaktan</h2>
        <p class="help-body" data-i18n="helpRemote"></p>
      </article>
      <article class="help-block">
        <h2 data-i18n="helpSafariTitle">iPhone Safari</h2>
        <p class="help-body" data-i18n="helpSafari"></p>
      </article>
    </section>

    <section id="screen-game" class="screen">
      <div class="game-top">
        <button type="button" class="btn-back compact" id="btn-game-back" data-i18n="back">Geri</button>
        <div class="phase-pill" id="phase-pill">—</div>
        <button type="button" class="btn btn-ghost compact" id="btn-resign" data-i18n="resign">Teslim Ol</button>
      </div>
      <div class="hud" id="hud"></div>
      <p class="hint" id="game-hint"></p>
      <div class="board-wrap">
        <svg id="board" viewBox="0 0 100 100" role="img" aria-label="Kuşatma tahtası"></svg>
      </div>
      <div class="deploy-actions hidden" id="deploy-actions">
        <button type="button" class="btn btn-ghost" id="btn-deploy-cancel" data-i18n="cancelPlace">İptal</button>
        <button type="button" class="btn btn-primary" id="btn-deploy-confirm" data-i18n="confirmPlace">Onayla</button>
      </div>
      <div id="game-over" class="game-over hidden">
        <h2 data-i18n="gameOver">Oyun bitti</h2>
        <p id="go-result"></p>
        <p id="go-reason" class="muted"></p>
        <div class="go-actions">
          <button type="button" class="btn btn-primary" id="btn-again" data-i18n="playAgain">Yeniden oyna</button>
          <button type="button" class="btn btn-ghost" id="btn-to-menu" data-i18n="toMenu">Menü</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app-config.js"></script>
  <script src="i18n.js"></script>
  <script src="engine.js"></script>
  <script src="ai.js"></script>
  <script src="shared/hub-back.js"></script>
  <script src="shared/score.js"></script>
  <script src="shared/register-sw.js"></script>
  <script src="game-client.js"></script>
</body>
</html>
